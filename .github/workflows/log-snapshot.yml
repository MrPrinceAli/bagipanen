# Snapshot event log untuk web (web/data/log-snapshot.json). Server /api/logs hanya memindai blok
# sesudah snapshot (RPC publik dibatasi 5.000 blok per eth_getLogs), jadi snapshot diperbarui
# berkala agar rentang itu tetap kecil. Commit snapshot memicu deploy Vercel seperti biasa.
name: Snapshot log web

on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

concurrency:
  group: snapshot-log
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pindai log sejak blok deploy
        run: node scripts/log-snapshot.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/log-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: perbarui snapshot log web"
          git push
