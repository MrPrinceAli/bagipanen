[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Script deploy menulis alamat ke ../deployments/<jaringan>.json
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
bscTestnet = "${BSC_TESTNET_RPC}"

# Verifikasi BscScan testnet lewat Etherscan API V2 (docs.etherscan.io/contract-verification/verify-with-foundry)
[etherscan]
bscTestnet = { key = "${BSCSCAN_API_KEY}", chain = 97, url = "https://api.etherscan.io/v2/api?chainid=97" }
